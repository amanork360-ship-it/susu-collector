kind = "web"
previewPath = "/"
title = "Susu Collector"
version = "1.0.0"
id = "artifacts/susu-collector"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24522

[services.development]
run = "pnpm --filter @workspace/susu-collector run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/susu-collector", "run", "build" ]
publicDir = "artifacts/susu-collector/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24522"
BASE_PATH = "/"
